project:
  type: website
  execute-dir: project  # 모든 .qmd가 프로젝트 루트에서 실행되어, 여러 랩이 같은 data/ 폴더를 공유
  output-dir: _site

metadata:
  author: "Byungkook Oh"

execute:
  freeze: auto

format:
  # https://quarto.org/docs/reference/formats/html.html
  # https://quarto.org/docs/output-formats/html-themes.html
  html:
    fontsize: 16.5px
    toc: true
    toc-title: "On this page"
    toc-location: right
    # number-sections: true
    # code-overflow: wrap
    date-modified: last-modified
    date-format: "YYYY.MM.DD"
    theme:
      light: [flatly, style.scss]  # flatly, cosmo, litera
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 300px

website:
  title: "Data Mining"
  # Quarto 빌드 시 canonical URL, sitemap 등의 base URL을 gli.konkuk.ac.kr 기준으로 생성하도록 설정
  site-url: https://gli.konkuk.ac.kr/board/lectures/dm-2026-fall
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: exercises/index.qmd
        text: Exercises 
      - href: assignments/index.qmd
        text: Assignments
      - icon: link-45deg
        href: http://gli.konkuk.ac.kr
        text: GLI Lab
    tools:
      - icon: github
        href: https://github.com/GLI-Lab/dm-2026-fall
        text: Data Mining 2026-fall GitHub

  sidebar:
    - id: exercises
      title: "Exercises"
      style: "floating"
      collapse-level: 2
      contents:
        - section: "Exercises"
          href: exercises/index.qmd
          contents:
            - exercises/environment-setup.qmd
            - section: "Lab0. Python Prerequisites"
              contents:
                - text: "Python Basics (⭐)"
                  href: exercises/lab00/python-basics.qmd
                - text: "NumPy Basics (⭐⭐)"
                  href: exercises/lab00/numpy-basics.qmd
                - text: "Matplotlib Basics"
                  href: exercises/lab00/matplotlib-basics.qmd
                - text: "Pandas Basics"
                  href: exercises/lab00/pandas-basics.qmd
            - section: "Lab1. Data Representations"
              contents:
                - text: "Exploring Data Representations"
                  href: exercises/lab01/lab01.qmd
    - id: assignments
      title: "Assignments"
      collapse-level: 1
      align: left
      contents:
        - section: "Assignments"
          href: assignments/index.qmd
          contents:
            - text: "TBA"
