project:
  type: website
  execute-dir: file  # cwd는 .qmd가 있는 폴더. helper.py / lab01_setup.py가 저장소 루트를 sys.path에 넣음
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!**/*-solution.qmd"
    - "!assignments/index.qmd"

metadata:
  author: "Byungkook Oh"

execute:
  freeze: auto

format:
  # https://quarto.org/docs/reference/formats/html.html
  # https://quarto.org/docs/output-formats/html-themes.html
  html:
    fontsize: 16.5px
    toc: true
    toc-title: "On this page"
    toc-location: right
    # number-sections: true
    # code-overflow: wrap
    date-modified: last-modified
    date-format: "YYYY.MM.DD"
    theme:
      light: [flatly, style.scss]  # flatly, cosmo, litera
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 300px

website:
  title: "Data Mining"
  # Quarto 빌드 시 canonical URL, sitemap 등의 base URL을 gli.konkuk.ac.kr 기준으로 생성하도록 설정
  site-url: https://gli.konkuk.ac.kr/board/lectures/dm-2026-fall
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: exercises/index.qmd
        text: Exercises 
      # - href: assignments/index.qmd
      #   text: Assignments
      - icon: link-45deg
        href: http://gli.konkuk.ac.kr
        text: GLI Lab
    tools:
      - icon: github
        href: https://github.com/GLI-Lab/dm-2026-fall
        text: Data Mining 2026-fall GitHub

  sidebar:
    - id: exercises
      title: "Exercises"
      style: "floating"
      collapse-level: 2
      contents:
        - section: "Exercises"
          href: exercises/index.qmd
          contents:
            - text: "Environment Setup (한)"
              href: exercises/environment-setup-ko.qmd
            - text: "Environment Setup (en)"
              href: exercises/environment-setup-en.qmd
            - section: "Lab0. Python Prerequisites"
              contents:
                - text: "Python Basics (⭐)"
                  href: exercises/lab00/python-basics.qmd
                - text: "NumPy Basics (⭐⭐)"
                  href: exercises/lab00/numpy-basics.qmd
                - text: "Matplotlib Basics"
                  href: exercises/lab00/matplotlib-basics.qmd
                - text: "Pandas Basics"
                  href: exercises/lab00/pandas-basics.qmd
            - section: "Lab1. Data Representations"
              contents:
                - text: "Record Data"
                  href: exercises/lab01/lab01-1-record.qmd
                - text: "Text Data"
                  href: exercises/lab01/lab01-2-text.qmd
                - text: "Graph Data"
                  href: exercises/lab01/lab01-3-graph.qmd
                - text: "Interaction Data"
                  href: exercises/lab01/lab01-4-interaction.qmd
                - text: "Transaction Data"
                  href: exercises/lab01/lab01-5-transaction.qmd
            - section: "Lab2. Data Preprocessing"
              contents:
                - text: "Cleaning, Aggregation, Sampling"
                  href: exercises/lab02/lab02-1.qmd
                - text: "Discretization, Binarization, Scaling"
                  href: exercises/lab02/lab02-2.qmd
                - text: "Similarity Graph"
                  href: exercises/lab02/lab02-3.qmd
            - section: "Lab3. Similarity and Dissimilarity"
              contents:
                - text: "Distance Measures"
                  href: exercises/lab03/lab03-1.qmd
                - text: "Similarity Measures"
                  href: exercises/lab03/lab03-2.qmd
