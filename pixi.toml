[workspace]
authors = ["GLI-Lab <glilab509@gmail.com>"]
channels = ["conda-forge"]
name = "data-mining-course"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"

numpy = "*"                  # W2-W15
scipy = "*"                  # W3 distance, W5 sparse matrix, W9 dendrogram
pandas = "*"                 # W2
scikit-learn = "*"           # W3, W4 TF-IDF, W6 PCA/SVD, W9-W11, W13
matplotlib = "*"             # W2-
seaborn = "*"                # W2 EDA, W3 correlation heatmap
nltk = "*"                   # W4 tokenization, stopwords, stemming
networkx = ">=3.1"           # W5, W10 Louvain, W12 PageRank/HITS, W15
mlxtend = "*"                # W7 apriori, fpgrowth, association_rules
gensim = ">=4.3.3"           # W14 Word2Vec, W15 DeepWalk/Node2Vec
jupyterlab = "*"             # notebooks, and Quarto executes .qmd cells through it

[tasks]
lab = "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser"

[environments]
default = []